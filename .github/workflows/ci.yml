# Integración continua y despliegue — IMPRESOS TRUJILLO E.I.R.L.
#
# Qué hace:
#   backend   -> instala dependencias, aplica las migraciones sobre un PostgreSQL
#                real y corre las 96 pruebas (incluidas las de integración que se
#                saltan cuando no hay base de datos).
#   frontend  -> instala, corre las pruebas y compila el build de producción.
#   desplegar -> solo en main y solo si los dos anteriores pasaron: entra por SSH
#                al VPS, aplica migraciones y reconstruye los contenedores.
#
# El artefacto compilado NO viaja al VPS: el despliegue reconstruye en el VPS
# desde el mismo commit ya validado. Los binarios nunca se suben por SSH.

name: CI

on:
  push:
    branches: [main, develop, gerardo]
  pull_request:
    branches: [main, develop, gerardo]
  # Permite relanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Si llegan varios pushes seguidos, cancela el anterior: no vale la pena validar
# commits que ya quedaron obsoletos.
#
# PERO en main NO se cancela. Dos merges seguidos a main cancelarian el primero
# a mitad de camino, y si eso pasa despues de las migraciones y antes de
# `up -d`, la base ya tiene el esquema nuevo mientras los contenedores siguen
# con el codigo viejo. En main los runs se encolan en vez de pisarse.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL real, igual que en el VPS: así las pruebas de integración que
    # se saltan sin base de datos SÍ corren y validan el dialecto de verdad
    # (FOR UPDATE, NUMERIC, enums como VARCHAR con CHECK).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: impresos_test
          POSTGRES_USER: impresos_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impresos_test -d impresos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://impresos_test:test@localhost:5432/impresos_test
      ENTORNO: pruebas
      LOG_LEVEL: WARNING
      # Valor de relleno: en producción el JWT_SECRET real se genera en el VPS.
      JWT_SECRET: secreto-solo-para-ci-no-reutilizar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Aplicar las migraciones desde cero detecta una migración rota ANTES de
      # que llegue a producción, que es donde duele.
      - name: Aplicar migraciones sobre base vacía
        run: python -m alembic upgrade head

      # Esto reproduce el escenario de recuperación de desastres: restaurar
      # una base CON filas y volver a aplicar (o revertir y reaplicar) el
      # esquema. Antes el CI solo migraba sobre una base vacía, así que se
      # coló una migración que fallaba con datos reales y un downgrade roto
      # (no hay vuelta atrás del esquema si nadie prueba que funciona).
      - name: Sembrar datos y probar downgrade/upgrade sobre una base con filas
        run: |
          python scripts/crear_admin.py --email admin@ci.local --password "SoloParaEsteCI123" --nombre "Admin CI"
          python scripts/seed_datos.py
          python -m alembic downgrade -2
          python -m alembic upgrade head

      - name: Pruebas
        run: python -m pytest -q

      # Ruff con reglas mínimas (errores de sintaxis y nombres/imports sin
      # resolver). No es una herramienta de estilo: eso generaría cientos de
      # avisos el primer día y el equipo la acabaría desactivando.
      - name: Lint (ruff)
        run: python -m ruff check app scripts tests

      # El Dockerfile se estrena en el VPS si no se construye aquí: un fallo en
      # la imagen se descubría durante un despliegue a producción.
      - name: Construir la imagen del backend
        run: docker build -t impresos-api:ci .

      # Y que la aplicación cargue dentro de la imagen, con la configuración de
      # producción: valida imports y las comprobaciones de arranque.
      - name: La aplicación arranca dentro de la imagen
        run: docker run --rm -e ENTORNO=produccion -e JWT_SECRET=comprobacion-del-ci impresos-api:ci python -c "from app.main import app; print(f'{len(app.routes)} rutas cargadas')"

  # ────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # --watch=false es obligatorio: sin eso el runner se queda esperando
      # cambios de archivos y el job nunca termina.
      - name: Pruebas
        run: npm run test -- --watch=false

      - name: Build de producción
        run: npm run build

      # El Dockerfile compila la SPA otra vez (multi-stage) y copia el
      # nginx.conf: construir aquí comprueba las dos cosas antes del despliegue.
      - name: Construir la imagen del frontend
        run: docker build -t impresos-web:ci .

      # Una línea inválida en nginx.conf tumbaba el despliegue entero. Aquí se
      # valida la configuración que va empaquetada en la imagen.
      - name: La configuración de nginx es válida
        run: docker run --rm impresos-web:ci nginx -t

  # ────────────────────────────────────────────────────────────────────────
  desplegar:
    name: Desplegar en el VPS
    needs: [backend, frontend]
    # Solo desde main (nunca desde una rama de trabajo) y solo con todo verde.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Entrar por SSH y reconstruir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # El despliegue vive en scripts/desplegar.sh, versionado y probado:
            # fija el commit, respalda antes de migrar y vuelve atrás si el
            # smoke test falla. Aquí solo se trae ese script y se ejecuta.
            cd $HOME/data/repos/impresos-trujillo
            git fetch --quiet origin
            git reset --hard ${{ github.sha }}

            bash scripts/desplegar.sh ${{ github.sha }}
