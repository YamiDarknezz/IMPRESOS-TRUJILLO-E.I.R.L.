# Configuración de nginx para el contenedor `web`.
#
# Sirve la SPA de Angular y reenvía /api al contenedor de FastAPI, de modo que
# el navegador solo habla con un dominio: sin CORS y sin exponer la API.

# ── Caché ──────────────────────────────────────────────────────────────────
# Se calcula con `map` y se emite UNA sola vez en el bloque `server` a
# propósito: si un `location` define su propio `add_header`, nginx DESCARTA los
# del bloque padre y las cabeceras de seguridad desaparecerían en silencio.
#
# OJO con la diferencia entre los dos tipos de archivo:
#
#  1. Artefactos del BUILD (main-35LE37TK.js, styles-KKVEYFVS.css): Angular les
#     pone el hash del contenido en el nombre, así que ese nombre nunca va a
#     tener otro contenido. Un año cacheado es seguro y es lo óptimo.
#
#  2. Recursos de `public/` (favicon.svg, logo.png): se copian SIN hash, con el
#     nombre tal cual. Cachearlos un año significa que si mañana se reemplaza el
#     logo, el navegador de quien ya visitó el sitio sigue mostrando el viejo
#     hasta un año. Por eso llevan un día de vida, no un año.
#
#     Por eso se distinguen por EXTENSIÓN y no por el patrón del hash: los .js y
#     .css del directorio de salida SIEMPRE vienen del build de Angular y
#     siempre llevan hash (outputHashing: all en angular.json).
#
#     ⚠️ Eso descansa en una invariante: que no haya ningún .js ni .css SIN hash
#     en public/. Hoy public/ solo tiene favicon.svg, favicon.ico, logo.png,
#     _headers y _redirects. Si algún día se agrega un .js o .css ahí, esta
#     regla lo cachearía un año y el cambio no llegaría a los navegadores.
#
#     Tampoco se usa `{6,}` para contar el largo del hash: sin escapar, nginx lee
#     la llave como inicio de bloque y no arranca; y escapada (\{6,\}) PCRE la
#     interpreta como llave literal, así que la regla nunca matchea. Por eso la
#     clasificación va por extensión.
map $uri $cache_control {
    default                                            "no-cache, no-store, must-revalidate";
    ~*\.(?:js|css)$                                     "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf)$   "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de seguridad ─────────────────────────────────────────────
    # NOTA: el repositorio tiene un archivo public/_headers con estas mismas
    # cabeceras, pero esa convención la leen Netlify y Cloudflare Pages — nginx
    # la ignora por completo. Sin este bloque, la aplicación se serviría SIN
    # CSP, sin X-Frame-Options y sin nosniff.
    #
    # `connect-src 'self'`: la aplicación pide /api al mismo origen, así que
    # 'self' basta. Si algún día la API vive en otro dominio, hay que agregarlo
    # aquí o el navegador bloqueará las peticiones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # ── API ────────────────────────────────────────────────────────────────
    # `proxy_pass` con variable + `resolver` (el DNS interno de Docker) en vez
    # de un nombre fijo: con nombre fijo, nginx resuelve el host UNA sola vez al
    # arrancar, y al recrear el contenedor de la API quedaría apuntando a una IP
    # muerta (502 hasta reiniciar nginx). Con la variable se resuelve en cada
    # petición.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Salud de la API: la usa el smoke test del despliegue.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_health http://api:8080/health;
        proxy_pass $api_health;
        proxy_set_header Host $host;
    }

    # ── SPA Angular ────────────────────────────────────────────────────────
    # try_files manda cualquier ruta desconocida a index.html, que es lo que
    # necesita el router de Angular para sus rutas del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
