# Configuración de nginx para el contenedor `web`.
#
# Sirve la SPA de Angular y reenvía /api al contenedor de FastAPI, de modo que
# el navegador solo habla con un dominio: sin CORS y sin exponer la API.

# ── Caché ──────────────────────────────────────────────────────────────────
# El build de Angular lleva hash en el nombre de cada archivo, así que los
# estáticos se pueden cachear un año. El resto (index.html) no se cachea nunca,
# porque es el que apunta a los archivos con hash nuevo.
#
# Se calcula con `map` y se emite UNA sola vez en el bloque `server` a
# propósito: si un `location` define su propio `add_header`, nginx DESCARTA los
# del bloque padre y las cabeceras de seguridad desaparecerían en silencio.
map $uri $cache_control {
    default                                                   "no-cache, no-store, must-revalidate";
    ~*\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webp)$   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de seguridad ─────────────────────────────────────────────
    # NOTA: el repositorio tiene un archivo public/_headers con estas mismas
    # cabeceras, pero esa convención la leen Netlify y Cloudflare Pages — nginx
    # la ignora por completo. Sin este bloque, la aplicación se serviría SIN
    # CSP, sin X-Frame-Options y sin nosniff.
    #
    # `connect-src 'self'`: la aplicación pide /api al mismo origen, así que
    # 'self' basta. Si algún día la API vive en otro dominio, hay que agregarlo
    # aquí o el navegador bloqueará las peticiones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # ── API ────────────────────────────────────────────────────────────────
    # `proxy_pass` con variable + `resolver` (el DNS interno de Docker) en vez
    # de un nombre fijo: con nombre fijo, nginx resuelve el host UNA sola vez al
    # arrancar, y al recrear el contenedor de la API quedaría apuntando a una IP
    # muerta (502 hasta reiniciar nginx). Con la variable se resuelve en cada
    # petición.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Salud de la API: la usa el smoke test del despliegue.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_health http://api:8080/health;
        proxy_pass $api_health;
        proxy_set_header Host $host;
    }

    # ── SPA Angular ────────────────────────────────────────────────────────
    # try_files manda cualquier ruta desconocida a index.html, que es lo que
    # necesita el router de Angular para sus rutas del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
