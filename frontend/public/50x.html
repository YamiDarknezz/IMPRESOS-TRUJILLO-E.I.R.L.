<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio no disponible — Impresos Trujillo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f8;
      color: #1f2937;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .aviso {
      max-width: 420px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.6rem;
    }
    p {
      margin: 0 0 1.2rem;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #4b5563;
    }
    a.boton {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      font-size: 0.88rem;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      background: #fff;
      color: #1f2937;
      text-decoration: none;
    }
    a.boton:hover {
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="aviso">
    <h1>El sistema no está respondiendo en este momento</h1>
    <p>
      Puede ser una actualización en curso. Vuelve a intentarlo en unos segundos;
      si sigue igual, avisa a sistemas. No hace falta que repitas el trabajo que
      estabas haciendo: si el guardado llegó a completarse, ya está registrado.
    </p>
    <!-- Enlace y no un botón con JavaScript: la CSP de la aplicación no permite
         scripts en línea, así que un `onclick` aquí no se ejecutaría. -->
    <a class="boton" href="/">Reintentar</a>
  </div>
</body>
</html>
