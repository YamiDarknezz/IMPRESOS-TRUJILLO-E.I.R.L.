<div class="login-wrapper">

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">
        <img src="logo.png" alt="">
      </div>
      <h1>Impresos Trujillo</h1>
      <p>Accede al sistema de gestión de Impresos Trujillo</p>
    </div>

    <form (ngSubmit)="onLogin()" novalidate>
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Ingrese su correo"
          autocomplete="email" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
          autocomplete="current-password" required>
      </div>

      @if (errorMessage) {
      <div class="error-msg">{{ errorMessage }}</div>
      }

      <button type="submit" class="btn-login" [disabled]="loading">
        @if (loading) {
        <span class="spinner"></span>
        Validando...
        } @else {
        Ingresar
        <span class="arrow">→</span>
        }
      </button>
    </form>

    <p class="login-footer">Sistema de uso interno · Impresos Trujillo</p>
  </div>

</div>
